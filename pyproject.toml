[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-smart-traffic-switching"
version = "0.1.0"
description = "AI-native telecom network simulation: dynamic unicast/broadcast switching PoC"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
]

[project.scripts]
traffic-sim = "traffic_sim.main:main"

[tool.setuptools.packages.find]
include = ["traffic_sim*", "config*"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
